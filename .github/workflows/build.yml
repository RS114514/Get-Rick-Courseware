name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-main:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Mono Compiler
      run: |
        sudo apt-get update -y
        sudo apt-get install -y mono-devel mono-roslyn

    - name: Build Windows Executable
      run: |
        chmod +x build-all.sh
        ./build-all.sh

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Rick-Release
        path: |
          publish-win/Rick.exe
          publish-win/获取Rick课件.exe

    - name: Release Binaries
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          publish-win/Rick.exe
          publish-win/获取Rick课件.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-dotnet:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --configuration Release --no-restore
      
    - name: Publish Windows (Self-contained)
      run: |
        dotnet publish RickCourseware.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./publish
        copy "publish\获取Rick课件.exe" "publish\Rick-net10.exe"
      
    - name: Upload Dotnet Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Rick-DotNet10
        path: ./publish/Rick-net10.exe
        
    - name: Release Dotnet Binary
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ./publish/Rick-net10.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
